{% extends "base.html" %}
{% block title %}Novo usineiro{% endblock %}
{% block content %}

<a href="{{ url_for('usineiros_lista') }}" class="btn btn-sm btn-outline-secondary mb-3">&larr; voltar</a>

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <h4 class="mb-3">Cadastrar usineiro</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">CPF/CNPJ</label>
        <input type="text" name="cpf_cnpj" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
  </div>
</div>

{% endblock %}
