{% extends "base.html" %}
{% block title %}Nova usina GD{% endblock %}
{% block content %}

<a href="{{ url_for('usinas_gd_lista') }}" class="btn btn-sm btn-outline-secondary mb-3">&larr; voltar</a>

<div class="card shadow-sm" style="max-width: 560px;">
  <div class="card-body">
    <h4 class="mb-3">Cadastrar usina GD</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Nome da usina</label>
        <input type="text" name="nome_usina" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Usineiro</label>
        <select name="usineiro_id" class="form-select">
          <option value="">—</option>
          {% for u in usineiros %}
            <option value="{{ u.id }}">{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Potência (kWp)</label>
        <input type="text" name="potencia_kwp" class="form-control" inputmode="decimal" placeholder="ex: 75,5">
      </div>
      <div class="mb-3">
        <label class="form-label">Concessionária</label>
        <input type="text" name="concessionaria" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
  </div>
</div>

{% endblock %}
