{% extends "base.html" %}
{% block title %}Editar {{ usina.nome_ufv }}{% endblock %}
{% block content %}

<a href="{{ url_for('ver_usina', usina_id=usina.id) }}" class="btn btn-sm btn-outline-secondary mb-3">&larr; voltar</a>

<div class="card shadow-sm" style="max-width: 640px;">
  <div class="card-body">
    <h4 class="mb-3">Editar dados da usina</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">UG</label>
        <input type="text" name="ug" class="form-control" value="{{ usina.ug_raw }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome UFV</label>
        <input type="text" name="nome_ufv" class="form-control" value="{{ usina.nome_ufv }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Concessionária</label>
        <input type="text" name="concessionaria" class="form-control" value="{{ usina.concessionaria or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Carteira (dono da carteira)</label>
        <select name="dono_carteira" class="form-select">
          <option value="">—</option>
          {% set nomes = usuarios | map(attribute='nome') | list %}
          {% if usina.dono_carteira and usina.dono_carteira not in nomes %}
            <option value="{{ usina.dono_carteira }}" selected>{{ usina.dono_carteira }} (atual)</option>
          {% endif %}
          {% for u in usuarios %}
            <option value="{{ u.nome }}" {{ 'selected' if u.nome == usina.dono_carteira else '' }}>{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Executivo (quem fechou a comercialização)</label>
        <select name="executivo" class="form-select">
          <option value="">—</option>
          {% for u in usuarios %}
            <option value="{{ u.nome }}" {{ 'selected' if u.nome == usina.executivo else '' }}>{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Geração média mensal (kWh)</label>
        <input type="text" name="geracao_media_mensal" class="form-control" inputmode="decimal"
               value="{{ usina.geracao_media_mensal if usina.geracao_media_mensal is not none else '' }}" placeholder="ex: 12500">
      </div>
      <div class="mb-3">
        <label class="form-label">Data de assinatura do contrato</label>
        <input type="date" name="data_assinatura" class="form-control" value="{{ usina.data_assinatura_contrato or '' }}">
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
  </div>
</div>

{% endblock %}
