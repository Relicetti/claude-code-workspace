<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel FUP{% endblock %} — Operações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f5f7fa; }
    .navbar { background: #1a3a5c !important; }
    .navbar-brand { color: #fff !important; }
    .table th { background: #1a3a5c; color: #fff; white-space: nowrap; }
    .etapa-titulo { font-weight: 600; color: #1a3a5c; }
    tr.atrasada { background: #fdecea !important; }
    .badge-eta { font-size: .8rem; }
  </style>
</head>
<body>
<nav class="navbar mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">🔧 Painel FUP Operações</a>
    <a href="{{ url_for('nova_usina') }}" class="btn btn-light btn-sm">+ Nova usina</a>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
