{% extends "base.html" %}
{% block title %}Nova usina{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-secondary">&larr; voltar</a>
  <a href="{{ url_for('importar_usinas') }}" class="btn btn-sm btn-outline-primary">Importar várias (planilha)</a>
</div>

<div class="card shadow-sm" style="max-width: 640px;">
  <div class="card-body">
    <h4 class="mb-3">Cadastrar nova usina</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">UG</label>
        <input type="text" name="ug" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome UFV</label>
        <input type="text" name="nome_ufv" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Concessionária</label>
        <input type="text" name="concessionaria" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Carteira (dono da carteira)</label>
        <select name="dono_carteira" class="form-select">
          <option value="">—</option>
          {% for u in usuarios %}
            <option value="{{ u.nome }}">{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Executivo (quem fechou a comercialização)</label>
        <select name="executivo" class="form-select">
          <option value="">—</option>
          {% for u in usuarios %}
            <option value="{{ u.nome }}">{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Geração média mensal (kWh)</label>
        <input type="text" name="geracao_media_mensal" class="form-control" inputmode="decimal" placeholder="ex: 12500">
      </div>
      <div class="mb-3">
        <label class="form-label">Data de assinatura do contrato</label>
        <input type="date" name="data_assinatura" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Pendência inicial</label>
        <textarea name="pendencia" class="form-control" rows="2" placeholder="Se preencher, a usina entra em &quot;Assinado c/ Pendência&quot;. Se deixar em branco, entra direto em &quot;TT Usina&quot;."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Responsável por essa pendência</label>
        <select name="responsavel" class="form-select">
          <option value="">—</option>
          {% for u in usuarios %}
            <option value="{{ u.nome }}">{{ u.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
  </div>
</div>

{% endblock %}
