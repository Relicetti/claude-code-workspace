{% extends "base.html" %}
{% block title %}Nova usina{% endblock %}
{% block content %}

<a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">&larr; voltar</a>

<div class="card shadow-sm" style="max-width: 640px;">
  <div class="card-body">
    <h4 class="mb-3">Cadastrar nova usina</h4>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">UG</label>
        <input type="text" name="ug" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome UFV</label>
        <input type="text" name="nome_ufv" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Concessionária</label>
        <input type="text" name="concessionaria" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Responsável / dono da carteira</label>
        <input type="text" name="dono_carteira" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Data de assinatura do contrato</label>
        <input type="date" name="data_assinatura" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Etapa inicial</label>
        <select name="etapa_inicial" class="form-select">
          {% for e in etapas %}
            <option value="{{ e }}">{{ e }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Observação</label>
        <textarea name="observacao" class="form-control" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
  </div>
</div>

{% endblock %}
