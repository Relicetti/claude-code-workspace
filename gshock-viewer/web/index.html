<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>G-Shock Viewer</title>
<style>
  :root {
    --bg: #f5f5f5; --card: #fff; --ink: #222; --muted: #898781;
    --line: #e1e0d9; --accent: #2a78d6; --hr: #eb4034; --steps: #1baf7a;
    --deep: #2a78d6; --light: #7db0e6; --awake: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --card:#1f2126; --ink:#eceef2; --muted:#9a9aa2; --line:#2c2f36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  .app { max-width:480px; margin:0 auto; padding:16px; min-height:100vh; background:var(--card); }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .live { display:flex; align-items:center; gap:16px; }
  .bpm-num { font-size:52px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .bpm-unit { font-size:14px; color:var(--muted); font-weight:600; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--hr); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.5} }
  .live-status { font-size:12px; color:var(--muted); }
  .big { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; align-items:baseline; }
  .stat-grid { display:flex; gap:18px; margin-top:6px; }
  .stat { display:flex; flex-direction:column; }
  .stat .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .stat .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .days { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
  .day-chip { flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink);
              border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; }
  .day-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  svg { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
  .legend span::before { content:''; display:inline-block; width:10px; height:10px; border-radius:2px;
                         margin-right:5px; vertical-align:middle; background:var(--sw,#000); }
  .banner { background:#fff6d6; color:#7a5c00; border:1px solid #f0d98a; border-radius:10px;
            padding:8px 12px; font-size:12px; margin-bottom:14px; }
  @media (prefers-color-scheme: dark){ .banner{ background:#3a3212; color:#e8d48a; border-color:#5a4d1c; } }
</style>
</head>
<body>
<div class="app">
  <h1>G-Shock Viewer</h1>
  <div class="sub" id="sub">GBD-H2000</div>

  <div id="banner" class="banner" style="display:none"></div>

  <div class="card">
    <h3>Batimentos ao vivo</h3>
    <div class="live">
      <div class="dot" id="dot"></div>
      <div><span class="bpm-num" id="bpm">--</span> <span class="bpm-unit">bpm</span></div>
      <div class="live-status" id="live-status" style="margin-left:auto">conectando…</div>
    </div>
  </div>

  <div class="days" id="days"></div>

  <div class="card">
    <h3>Passos</h3>
    <div class="row"><div class="big" id="steps">--</div><div class="live-status" id="steps-date"></div></div>
    <svg id="steps-chart" viewBox="0 0 340 120"></svg>
  </div>

  <div class="card">
    <h3>Batimentos no dia</h3>
    <div class="stat-grid">
      <div class="stat"><span class="k">Repouso</span><span class="v" id="hr-rest">--</span></div>
      <div class="stat"><span class="k">Mín</span><span class="v" id="hr-min">--</span></div>
      <div class="stat"><span class="k">Máx</span><span class="v" id="hr-max">--</span></div>
    </div>
    <svg id="hr-chart" viewBox="0 0 340 120"></svg>
  </div>

  <div class="card">
    <h3>Sono</h3>
    <div class="row"><div class="big" id="sleep-total">--</div></div>
    <svg id="sleep-chart" viewBox="0 0 340 46"></svg>
    <div class="legend">
      <span style="--sw:var(--deep)">Profundo</span>
      <span style="--sw:var(--light)">Leve</span>
      <span style="--sw:var(--awake)">Acordado</span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let health = null, selected = 0;

// ---------- BPM ao vivo (SSE) ----------
function startLive() {
  try {
    const es = new EventSource('/api/live');
    es.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.fresh && d.bpm > 0) {
        $('bpm').textContent = d.bpm;
        $('dot').classList.add('on');
        $('live-status').textContent = 'ao vivo';
      } else {
        $('dot').classList.remove('on');
        $('live-status').textContent = d.connected ? 'sem medição (entre no modo batimentos)' : 'relógio desconectado';
        if (!d.fresh) $('bpm').textContent = '--';
      }
    };
    es.onerror = () => { $('live-status').textContent = 'sem stream ao vivo'; };
  } catch (_) {}
}

// ---------- helpers de gráfico ----------
function barChart(svg, values, color, fmt) {
  const W = 340, H = 120, pad = 18, n = values.length;
  if (!n) { svg.innerHTML = ''; return; }
  const max = Math.max(1, ...values);
  const bw = (W - pad*2) / n * 0.62, gap = (W - pad*2) / n;
  let s = '';
  values.forEach((v, i) => {
    const h = (v / max) * (H - pad*2);
    const x = pad + i*gap + (gap - bw)/2, y = H - pad - h;
    const active = i === selected;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}"
           rx="3" fill="${color}" opacity="${active?1:0.45}"/>`;
  });
  svg.innerHTML = s;
}

function lineChart(svg, values, color) {
  const W = 340, H = 120, pad = 16, n = values.length;
  if (n < 2) { svg.innerHTML = ''; return; }
  const max = Math.max(...values), min = Math.min(...values), rng = Math.max(1, max-min);
  const step = (W - pad*2) / (n-1);
  const pts = values.map((v,i) => [pad + i*step, H - pad - ((v-min)/rng)*(H-pad*2)]);
  const d = pts.map((p,i) => (i? 'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ` L ${pts[n-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
  svg.innerHTML =
    `<path d="${area}" fill="${color}" opacity="0.12"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
}

function sleepBar(svg, s) {
  const W = 340, H = 46, y = 8, h = 30, pad = 2;
  const total = (s.deep||0)+(s.light||0)+(s.awake||0);
  if (!total) { svg.innerHTML = ''; return; }
  const parts = [['deep', s.deep||0], ['light', s.light||0], ['awake', s.awake||0]];
  const colors = { deep:'var(--deep)', light:'var(--light)', awake:'var(--awake)' };
  let x = 0, out = '';
  parts.forEach(([k, v]) => {
    const w = (v/total) * W;
    out += `<rect x="${x+pad}" y="${y}" width="${Math.max(0,w-pad*2)}" height="${h}" rx="4" fill="${colors[k]}"/>`;
    x += w;
  });
  svg.innerHTML = out;
}

function fmtMin(m) { if (m==null) return '--'; const h=Math.floor(m/60), mm=m%60; return `${h}h ${mm}min`; }
function shortDate(s){ const [_,mm,dd]=s.split('-'); return `${dd}/${mm}`; }

// ---------- render ----------
function renderDays() {
  $('days').innerHTML = health.days.map((d,i) =>
    `<button class="day-chip ${i===selected?'active':''}" data-i="${i}">${shortDate(d.date)}</button>`
  ).join('');
  document.querySelectorAll('.day-chip').forEach(b =>
    b.onclick = () => { selected = +b.dataset.i; render(); });
}

function render() {
  const days = health.days;
  if (!days.length) { $('sub').textContent = 'Sem dados ainda — rode sync.py'; return; }
  const d = days[selected];
  renderDays();

  $('steps').textContent = (d.steps ?? 0).toLocaleString('pt-BR');
  $('steps-date').textContent = shortDate(d.date);
  barChart($('steps-chart'), days.map(x => x.steps||0), 'var(--steps)');

  const hr = d.hr || {};
  $('hr-rest').textContent = hr.resting ?? '--';
  $('hr-min').textContent = hr.min ?? '--';
  $('hr-max').textContent = hr.max ?? '--';
  lineChart($('hr-chart'), (hr.series && hr.series.length? hr.series : [hr.min||60, hr.max||60]), 'var(--hr)');

  const sl = d.sleep || {};
  $('sleep-total').textContent = fmtMin(sl.total);
  sleepBar($('sleep-chart'), sl);
}

async function load() {
  try {
    const r = await fetch('/api/health');
    health = await r.json();
    if (health.sample) {
      $('banner').style.display = 'block';
      $('banner').textContent = 'Mostrando dados de EXEMPLO. Assim que o sync.py rodar com o relógio, aparecem os seus dados reais.';
    }
    selected = Math.max(0, (health.days||[]).length - 1);
    render();
  } catch (e) {
    $('sub').textContent = 'Não consegui carregar /api/health';
  }
}

load();
startLive();
</script>
</body>
</html>
