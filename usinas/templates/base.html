<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Usinas{% endblock %} — Painel de Usinas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f5f7fa; }
    .navbar { background: #1a3a5c !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: #f0c040 !important; }
    .card-kpi { border-left: 4px solid #1a3a5c; }
    .badge-pago { background: #198754; }
    .badge-atrasado { background: #dc3545; }
    .badge-aberto { background: #ffc107; color: #000; }
    .badge-outros { background: #6c757d; }
    .table th { background: #1a3a5c; color: #fff; white-space: nowrap; }
    .valor-negativo { color: #dc3545; }
    .valor-positivo { color: #198754; }
    .tabela-interativa thead th.ordenavel { cursor: pointer; user-select: none; }
    .tabela-interativa thead th.ordenavel:hover { background: #234a72; }
    .tabela-interativa .sort-ind { font-size: 0.7em; opacity: 0.85; }
    .tabela-interativa .filtro-row th { background: #fff; padding: 4px 6px; }
    .tabela-interativa .filtro-row input { font-size: 0.8rem; }
    .tabela-interativa .totais-row th { background: #f0c040; color: #1a3a5c; cursor: default; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">☀️ Painel de Usinas</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('clientes_problematicos') }}">Clientes Problemáticos</a></li>
        <li class="nav-item"><a class="nav-link btn btn-warning text-dark ms-2 px-3" href="{{ url_for('upload') }}">+ Importar Excel</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
// Deixa qualquer <table class="tabela-interativa"> ordenavel (clique no th)
// e filtravel por coluna (linha de inputs logo abaixo do cabecalho).
function initTabelaInterativa(table) {
  const thead = table.tHead;
  const tbody = table.tBodies[0];
  if (!thead || !tbody) return;
  const headerRow = thead.querySelector('tr.cabecalho') || thead.rows[0];
  const filterRow = thead.querySelector('tr.filtro-row');
  let sortState = { col: null, asc: true };

  Array.from(headerRow.cells).forEach((th, idx) => {
    if (th.classList.contains('no-sort')) return;
    th.classList.add('ordenavel');
    th.addEventListener('click', () => {
      const asc = sortState.col === idx ? !sortState.asc : true;
      sortState = { col: idx, asc };
      const tipo = th.dataset.tipo || 'texto';
      const linhas = Array.from(tbody.rows);
      linhas.sort((a, b) => {
        const ca = a.cells[idx], cb = b.cells[idx];
        if (!ca || !cb) return 0;
        let va = ca.dataset.valor !== undefined ? ca.dataset.valor : ca.textContent.trim();
        let vb = cb.dataset.valor !== undefined ? cb.dataset.valor : cb.textContent.trim();
        if (tipo === 'num') {
          va = parseFloat(va) || 0;
          vb = parseFloat(vb) || 0;
          return asc ? va - vb : vb - va;
        }
        return asc ? va.localeCompare(vb, 'pt-BR') : vb.localeCompare(va, 'pt-BR');
      });
      linhas.forEach(r => tbody.appendChild(r));
      Array.from(headerRow.cells).forEach(c => { const s = c.querySelector('.sort-ind'); if (s) s.remove(); });
      const ind = document.createElement('span');
      ind.className = 'sort-ind ms-1';
      ind.textContent = asc ? '▲' : '▼';
      th.appendChild(ind);
    });
  });

  if (filterRow) {
    const aplicarFiltros = () => {
      const filtros = Array.from(filterRow.cells).map(c => (c.querySelector('input')?.value || '').toLowerCase().trim());
      Array.from(tbody.rows).forEach(row => {
        const visivel = filtros.every((f, i) => !f || (row.cells[i] && row.cells[i].textContent.toLowerCase().includes(f)));
        row.style.display = visivel ? '' : 'none';
      });
    };
    Array.from(filterRow.cells).forEach(th => {
      const input = th.querySelector('input');
      if (input) input.addEventListener('input', aplicarFiltros);
    });
  }
}
document.querySelectorAll('table.tabela-interativa').forEach(initTabelaInterativa);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
