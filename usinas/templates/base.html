<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Usinas{% endblock %} — Painel de Usinas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f5f7fa; }
    .navbar { background: #1a3a5c !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: #f0c040 !important; }
    .card-kpi { border-left: 4px solid #1a3a5c; }
    .badge-pago { background: #198754; }
    .badge-atrasado { background: #dc3545; }
    .badge-aberto { background: #ffc107; color: #000; }
    .badge-outros { background: #6c757d; }
    .table th { background: #1a3a5c; color: #fff; white-space: nowrap; }
    .valor-negativo { color: #dc3545; }
    .valor-positivo { color: #198754; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">☀️ Painel de Usinas</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('clientes_problematicos') }}">Clientes Problemáticos</a></li>
        <li class="nav-item"><a class="nav-link btn btn-warning text-dark ms-2 px-3" href="{{ url_for('upload') }}">+ Importar Excel</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
