<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estimativa de Geração{% endblock %} — Usina Solar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f5f7fa; }
    .navbar { background: #1a3a5c !important; }
    .navbar-brand { color: #fff !important; }
    .card-resumo { border-left: 4px solid #1a3a5c; }
    .table th { background: #1a3a5c; color: #fff; white-space: nowrap; }
  </style>
</head>
<body>
<nav class="navbar mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">☀️ Estimativa de Geração — Usina Solar</a>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
